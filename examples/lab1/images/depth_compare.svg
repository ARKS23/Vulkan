<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2d3748"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #1a202c; }
      .label { font: 600 16px sans-serif; fill: #1a202c; }
      .small { font: 13px sans-serif; fill: #4a5568; }
      .axis { stroke: #2d3748; stroke-width: 3; marker-end: url(#arrow); }
      .tick { stroke: #2d3748; stroke-width: 2; }
      .box { fill: #f7fafc; stroke: #2d3748; stroke-width: 2; rx: 14; }
      .blue { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 2; }
      .red { fill: #fff5f5; stroke: #c53030; stroke-width: 2; }
      .green { fill: #f0fff4; stroke: #2f855a; stroke-width: 2; }
      .arrowLine { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="360" fill="#ffffff"/>
  <text class="title" x="32" y="42">Depth Compare in Light Space</text>

  <line class="axis" x1="110" y1="165" x2="835" y2="165"/>
  <text class="small" x="100" y="200">near 0</text>
  <text class="small" x="795" y="200">far 1</text>

  <line class="tick" x1="370" y1="145" x2="370" y2="185"/>
  <line class="tick" x1="585" y1="145" x2="585" y2="185"/>
  <line class="tick" x1="548" y1="152" x2="548" y2="178"/>

  <rect class="blue" x="292" y="72" width="160" height="58" rx="14"/>
  <text class="label" x="318" y="104">closestDepth</text>
  <text class="small" x="323" y="123">from shadow map</text>

  <rect class="red" x="500" y="230" width="170" height="58" rx="14"/>
  <text class="label" x="528" y="262">currentDepth</text>
  <text class="small" x="526" y="281">current fragment</text>

  <rect class="green" x="455" y="72" width="190" height="58" rx="14"/>
  <text class="label" x="486" y="104">current - bias</text>
  <text class="small" x="486" y="123">used for compare</text>

  <path class="arrowLine" d="M370 130 V144"/>
  <path class="arrowLine" d="M585 230 V186"/>
  <path class="arrowLine" d="M548 130 V150"/>

  <rect class="box" x="95" y="260" width="300" height="58" rx="14"/>
  <text class="label" x="120" y="294">if currentDepth - bias &gt; closestDepth</text>
  <text class="small" x="148" y="313">the fragment is in shadow</text>

  <text class="small" x="520" y="330">Both depths must be compared in the same light-space depth range.</text>
</svg>
